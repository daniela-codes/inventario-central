{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Inventario CEIA La Pintana</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
    <main class="login-page">
        <section class="login-card" aria-label="Inicio de sesión">
            <div class="brand">
                <img class="brand-logo" src="{% static 'ceia_la_pintana.png' %}" alt="CEIA La Pintana">
                <div>
                    <h1>Inventario Central</h1>
                    <p>Sistema institucional de inventario</p>
                </div>
            </div>

            <div class="login-heading">
                <h2>Iniciar sesión</h2>
                <p>Ingresa tus credenciales para continuar.</p>
            </div>

            {% if error %}
                <div class="login-error" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="field">
                    <label for="username">Usuario</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Ingresa tu usuario"
                        required
                        autofocus
                    >
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Iniciar sesión
                </button>
            </form>

            <p class="login-footer">
                Inventario Central · CEIA La Pintana
            </p>
        </section>
    </main>
</body>
</html>
