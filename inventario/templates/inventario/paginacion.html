{% if pagina.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Paginación">{% if pagina.has_previous %}<a href="?page={{ pagina.previous_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}">‹ Anterior</a>{% endif %}<span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>{% if pagina.has_next %}<a href="?page={{ pagina.next_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}">Siguiente ›</a>{% endif %}</nav>{% endif %}
